<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
  (function () {
    var saved = localStorage.getItem('cx-theme') || 'system';
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  :root {
    --bg: #f5f4f0;
    --panel: #ffffff;
    --border: #dcdad3;
    --text: #1c1d1f;
    --muted: #6b7078;
    --accent: #d97757;
    --accent-hover: #c96a4c;
    --danger: #e5534b;
    --input-bg: #ffffff;
    --mono: 'SF Mono', Consolas, 'Courier New', monospace;
  }
  html[data-theme="dark"] {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --input-bg: #0f1115;
  }
  @media (prefers-color-scheme: dark) {
    html[data-theme="system"] {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e6e8eb;
      --muted: #8b93a1;
      --input-bg: #0f1115;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .icon-select { display: inline-flex; align-items: center; gap: 6px; }
  .icon-select svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; }
  .icon-select select {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 8px;
    cursor: pointer;
    font-family: inherit;
  }
  #login-screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #login-screen .login-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #login-screen .top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; align-items: center; }
  .login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 320px;
  }
  .login-box h1 { font-size: 18px; margin: 0 0 20px; }
  input[type=password], input[type=text], textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { font-family: var(--mono); resize: vertical; }
  button {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.danger { background: var(--danger); }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }

  #app { display: none; height: 100vh; flex-direction: column; }
  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; }
  header nav.main-nav { flex: 1; display: flex; gap: 4px; margin-left: 24px; }

  main { flex: 1; display: flex; overflow: hidden; }
  nav {
    width: 200px;
    border-right: 1px solid var(--border);
    padding: 16px 0;
  }
  nav button.tab {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--muted);
    border-radius: 0;
    padding: 10px 20px;
    font-weight: 500;
  }
  nav button.tab.active { color: var(--text); background: var(--panel); border-left: 2px solid var(--accent); }

  nav .nav-separator { border: none; border-top: 1px solid var(--border); margin: 10px 16px; }
  nav .new-chat-btn {
    display: block;
    width: calc(100% - 32px);
    margin: 0 16px 8px;
    font-size: 13px;
    padding: 8px 10px;
    text-align: left;
  }
  nav .cli-sessions { padding: 0 16px; overflow-y: auto; max-height: 220px; }
  nav .cli-session-item {
    padding: 6px 4px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--muted);
    cursor: pointer;
    border-radius: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  nav .cli-session-item:hover { background: var(--panel); }
  nav .cli-session-item.active { background: var(--panel); color: var(--text); }
  nav .cli-session-item .session-time { display: block; font-size: 10px; opacity: 0.7; }
  nav .cli-empty { padding: 4px; font-size: 11px; color: var(--muted); }

  .content { flex: 1; display: flex; overflow: hidden; }
  .list-pane { width: 260px; border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
  .list-pane .item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    font-family: var(--mono);
  }
  .list-pane .item:hover { background: var(--panel); }
  .list-pane .item.active { background: var(--panel); color: var(--text); }
  .list-pane .new-item { margin-bottom: 10px; width: 100%; }
  .status-badge {
    display: inline-block;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 999px;
    margin-left: 6px;
    border: 1px solid var(--border);
    color: var(--muted);
    vertical-align: 1px;
  }
  .status-badge.status-in-progress { color: var(--accent); border-color: var(--accent); }
  .status-badge.status-done { color: #3fae74; border-color: #3fae74; }

  .editor-pane { flex: 1; display: flex; flex-direction: column; padding: 16px; overflow: hidden; }
  .editor-pane .toolbar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .editor-pane textarea { flex: 1; width: 100%; }
  .empty-state { color: var(--muted); padding: 40px; text-align: center; }

  .cron-editor { padding: 20px; max-width: 760px; overflow-y: auto; }
  .cron-editor .cron-help { font-size: 12px; color: var(--muted); margin-bottom: 14px; font-family: var(--mono); }
  .cron-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .cron-row input { flex: 1; font-family: var(--mono); }

  .cli-pane { flex: 1; display: flex; flex-direction: column; background: #0f1115; }
  .cli-pane .cli-terminal { flex: 1; padding: 8px; overflow: hidden; }
  .cli-pane .cli-status {
    padding: 6px 14px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    border-top: 1px solid #2a2f3a;
  }

  .hooks-editor { padding: 20px; max-width: 700px; }
  .hook-group { margin-bottom: 24px; }
  .hook-group h3 { font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
  .hook-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .hook-row input { flex: 1; font-family: var(--mono); }

  .app-footer {
    padding: 8px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-shrink: 0;
  }
  .app-footer a {
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
  }
  .app-footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-content">
    <div class="top-controls">
      <div class="lang-switch icon-select" id="lang-switch-login"></div>
      <div class="theme-switch icon-select" id="theme-switch-login"></div>
    </div>
    <div class="login-box">
      <h1>Claude Dashboard</h1>
      <input type="text" id="username-input" data-i18n-placeholder="login.username_placeholder" autocomplete="username" autofocus>
      <div style="height:8px;"></div>
      <input type="password" id="password-input" data-i18n-placeholder="login.password_placeholder" autocomplete="current-password">
      <div class="error-msg" id="login-error"></div>
      <button id="login-btn" style="width:100%;margin-top:10px;" data-i18n="login.button"></button>
    </div>
  </div>
  <footer class="app-footer">
    <a href="https://automation-ai.eu/" target="_blank" rel="noopener noreferrer">automation-ai.eu</a>
  </footer>
</div>

<div id="app">
  <header>
    <h1>Claude Dashboard</h1>
    <nav class="main-nav"></nav>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="ws-user" id="current-user" style="font-size:12px;color:var(--muted);font-family:var(--mono);"></span>
      <div class="lang-switch icon-select" id="lang-switch-app"></div>
      <div class="theme-switch icon-select" id="theme-switch-app"></div>
      <button class="secondary" id="logout-btn" data-i18n="header.logout"></button>
    </div>
  </header>
  <main>
    <nav>
      <button class="tab active" data-tab="tasks" data-i18n="nav.tasks"></button>
      <button class="tab" data-tab="commands" data-i18n="nav.commands"></button>
      <button class="tab" data-tab="skills" data-i18n="nav.skills"></button>
      <button class="tab" data-tab="agents" data-i18n="nav.agents"></button>
      <button class="tab" data-tab="hooks" data-i18n="nav.hooks"></button>
      <button class="tab" data-tab="cron" data-i18n="nav.cron"></button>
      <hr class="nav-separator">
      <button class="new-chat-btn secondary" id="new-chat-btn" data-i18n="cli.new_chat"></button>
      <div class="cli-sessions" id="cli-sessions-list"></div>
    </nav>
    <div class="content" id="content"></div>
  </main>
  <footer class="app-footer">
    <a href="https://automation-ai.eu/" target="_blank" rel="noopener noreferrer">automation-ai.eu</a>
  </footer>
</div>

<script src="i18n.js"></script>
<script>
const API = '/api';
let currentTab = 'tasks';
let currentItem = null;

async function api(method, url, body) {
  const res = await fetch(API + url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'include'
  });
  if (res.status === 401 || res.status === 503) {
    showLogin(res.status === 503 ? '' : t('login.error_session_expired'));
    throw new Error('unauthorized');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// --- Przelacznik motywu: jasny / ciemny / systemowy ---
const THEME_ICONS = {
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>'
};

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('cx-theme', theme);
  renderThemeSwitches();
}

function renderThemeSwitches() {
  const current = localStorage.getItem('cx-theme') || 'system';
  document.querySelectorAll('.theme-switch').forEach((container) => {
    const options = ['light', 'dark', 'system']
      .map((theme) => `<option value="${theme}" ${theme === current ? 'selected' : ''}>${t('theme.' + theme)}</option>`)
      .join('');
    container.innerHTML = `<span class="icon-select-icon">${THEME_ICONS[current]}</span><select aria-label="${t('theme.' + current)}">${options}</select>`;
    container.querySelector('select').onchange = (e) => applyTheme(e.target.value);
  });
}

function showLogin(msg) {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-error').textContent = msg || '';
}

function showApp(username) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  if (username) document.getElementById('current-user').textContent = username;
  renderTab();
  loadCliSessionsList();
}

document.getElementById('login-btn').onclick = async () => {
  const username = document.getElementById('username-input').value;
  const password = document.getElementById('password-input').value;
  try {
    const result = await api('POST', '/auth/login', { username, password });
    showApp(result.username);
  } catch (e) {
    document.getElementById('login-error').textContent = t('login.error_wrong_password');
  }
};
document.getElementById('username-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('password-input').focus();
});
document.getElementById('password-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

document.getElementById('logout-btn').onclick = async () => {
  closeCliConnection();
  await api('POST', '/auth/logout');
  showLogin();
};

document.querySelectorAll('nav .tab').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('nav .tab').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('nav .cli-session-item').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    closeCliConnection();
    currentTab = btn.dataset.tab;
    currentItem = null;
    renderTab();
  };
});

async function renderTab() {
  const content = document.getElementById('content');
  if (currentTab === 'hooks') {
    content.innerHTML = `<div class="hooks-editor" id="hooks-editor">${t('hooks.loading')}</div>`;
    await renderHooks();
    return;
  }
  if (currentTab === 'cron') {
    content.innerHTML = `<div class="cron-editor" id="cron-editor">${t('hooks.loading')}</div>`;
    await renderCron();
    return;
  }
  if (currentTab === 'cli') {
    return; // renderowane przez openCli()
  }
  content.innerHTML = `
    <div class="list-pane">
      <button class="new-item secondary" id="new-item-btn" data-i18n="list.new"></button>
      <div id="item-list"></div>
    </div>
    <div class="editor-pane" id="editor-pane">
      <div class="empty-state" data-i18n="list.select_or_create"></div>
    </div>
  `;
  applyTranslations();
  document.getElementById('new-item-btn').onclick = createNewItem;
  await loadList();
}

// Statusy przechowujemy w pliku jako kanoniczne angielskie slowa (todo /
// in-progress / done), zeby dzialaly niezaleznie od jezyka interfejsu.
// Rozpoznajemy tez stare warianty (np. "w trakcie" z wczesniejszych wersji
// panelu) dla wstecznej zgodnosci, ale zawsze wyswietlamy przetlumaczona etykiete.
function normalizeStatus(raw) {
  const s = raw.trim().toLowerCase();
  const done = ['done', 'gotowe', 'zrobione', 'complete', 'completed', 'erledigt', 'fertig', 'hecho'];
  const inProgress = ['in-progress', 'in progress', 'w trakcie', 'in arbeit', 'en curso', 'en progreso'];
  if (done.includes(s)) return 'done';
  if (inProgress.includes(s)) return 'in-progress';
  return 'todo';
}

async function loadList() {
  const items = await api('GET', `/${currentTab}`);
  const listEl = document.getElementById('item-list');
  listEl.innerHTML = items
    .map((it) => {
      let badge = '';
      if (it.status) {
        const canonical = normalizeStatus(it.status);
        const label = t('status.' + canonical.replace('-', '_'));
        badge = ` <span class="status-badge status-${canonical}">${escapeHtml(label)}</span>`;
      }
      return `<div class="item" data-name="${it.name}">${it.name}${badge}</div>`;
    })
    .join('') || `<div class="empty-state" style="padding:10px;font-size:12px;">${t('list.empty')}</div>`;

  listEl.querySelectorAll('.item').forEach((el) => {
    el.onclick = () => openItem(el.dataset.name);
  });
}

function taskTemplate(name) {
  return `# ${name}\n\nStatus: todo\n\n## ${t('template.goal')}\n\n\n## ${t('template.context')}\n\n\n## ${t('template.steps')}\n- [ ] \n- [ ] \n- [ ] \n\n## ${t('template.acceptance_criteria')}\n- \n`;
}

const NEW_ITEM_TEMPLATES = {
  tasks: taskTemplate,
  commands: (name) => `# ${name}\n\n`,
  skills: (name) => `# ${name}\n\n`,
  agents: (name) => `# ${name}\n\n`
};

async function createNewItem() {
  const name = prompt(t('prompt.new_name'));
  if (!name) return;
  try {
    const content = (NEW_ITEM_TEMPLATES[currentTab] || ((n) => `# ${n}\n\n`))(name);
    await api('PUT', `/${currentTab}/${encodeURIComponent(name)}`, { content });
    await loadList();
    openItem(name);
  } catch (e) {
    alert(t('error.prefix') + e.message);
  }
}

async function openItem(name) {
  currentItem = name;
  document.querySelectorAll('.list-pane .item').forEach((el) => {
    el.classList.toggle('active', el.dataset.name === name);
  });
  const { content } = await api('GET', `/${currentTab}/${encodeURIComponent(name)}`);
  const pane = document.getElementById('editor-pane');
  pane.innerHTML = `
    <div class="toolbar">
      <strong style="font-family:var(--mono);font-size:13px;">${name}.md</strong>
      <span style="flex:1;"></span>
      <button id="save-btn" data-i18n="editor.save"></button>
      <button class="danger" id="delete-btn" data-i18n="editor.delete"></button>
    </div>
    <textarea id="editor-textarea">${escapeHtml(content)}</textarea>
  `;
  applyTranslations();
  document.getElementById('save-btn').onclick = async () => {
    const value = document.getElementById('editor-textarea').value;
    await api('PUT', `/${currentTab}/${encodeURIComponent(name)}`, { content: value });
  };
  document.getElementById('delete-btn').onclick = async () => {
    if (!confirm(t('editor.confirm_delete', { name }))) return;
    await api('DELETE', `/${currentTab}/${encodeURIComponent(name)}`);
    currentItem = null;
    await loadList();
    document.getElementById('editor-pane').innerHTML = `<div class="empty-state">${t('list.select_or_create')}</div>`;
  };
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function renderHooks() {
  const hooks = await api('GET', '/hooks');
  const el = document.getElementById('hooks-editor');
  const groups = ['pre-command', 'post-command', 'on-error'];
  const labelKeys = { 'pre-command': 'hooks.pre_command', 'post-command': 'hooks.post_command', 'on-error': 'hooks.on_error' };

  el.innerHTML = groups
    .map(
      (g) => `
    <div class="hook-group" data-group="${g}">
      <h3>${t(labelKeys[g])}</h3>
      <div class="hook-rows"></div>
      <button class="secondary add-hook-btn" data-group="${g}">${t('hooks.add')}</button>
    </div>`
    )
    .join('') + `<button id="save-hooks-btn">${t('hooks.save')}</button>`;

  groups.forEach((g) => renderHookRows(g, hooks[g] || []));

  el.querySelectorAll('.add-hook-btn').forEach((btn) => {
    btn.onclick = () => {
      const g = btn.dataset.group;
      const rows = getHookValues(g);
      rows.push('');
      renderHookRows(g, rows);
    };
  });

  document.getElementById('save-hooks-btn').onclick = async () => {
    const payload = {};
    groups.forEach((g) => (payload[g] = getHookValues(g).filter((v) => v.trim())));
    await api('PUT', '/hooks', payload);
    alert(t('hooks.saved'));
  };
}

function renderHookRows(group, values) {
  const container = document.querySelector(`.hook-group[data-group="${group}"] .hook-rows`);
  container.innerHTML = values
    .map(
      (v, i) => `
    <div class="hook-row">
      <input type="text" value="${escapeHtml(v)}" data-idx="${i}">
      <button class="danger remove-hook-btn" data-idx="${i}">x</button>
    </div>`
    )
    .join('');
  container.querySelectorAll('.remove-hook-btn').forEach((btn) => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const rows = getHookValues(group);
      rows.splice(idx, 1);
      renderHookRows(group, rows);
    };
  });
}

function getHookValues(group) {
  const inputs = document.querySelectorAll(`.hook-group[data-group="${group}"] input`);
  return Array.from(inputs).map((i) => i.value);
}

// --- Cron ---
async function renderCron() {
  const jobs = await api('GET', '/cron');
  const el = document.getElementById('cron-editor');
  el.innerHTML = `
    <div class="cron-help" data-i18n="cron.help"></div>
    <div id="cron-rows"></div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="secondary" id="add-cron-btn" data-i18n="cron.add"></button>
      <button id="save-cron-btn" data-i18n="cron.save"></button>
    </div>
  `;
  applyTranslations();
  renderCronRows(jobs.map((j) => j.raw));

  document.getElementById('add-cron-btn').onclick = () => {
    renderCronRows([...getCronValues(), '']);
  };
  document.getElementById('save-cron-btn').onclick = async () => {
    try {
      await api('PUT', '/cron', { lines: getCronValues() });
      alert(t('hooks.saved'));
    } catch (e) {
      alert(t('error.prefix') + e.message);
    }
  };
}

function renderCronRows(values) {
  const container = document.getElementById('cron-rows');
  container.innerHTML = values
    .map(
      (v, i) => `
    <div class="cron-row">
      <input type="text" value="${escapeHtml(v)}" data-idx="${i}" data-i18n-placeholder="cron.line_placeholder">
      <button class="danger remove-cron-btn" data-idx="${i}">x</button>
    </div>`
    )
    .join('');
  applyTranslations();
  container.querySelectorAll('.remove-cron-btn').forEach((btn) => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const rows = getCronValues();
      rows.splice(idx, 1);
      renderCronRows(rows);
    };
  });
}

function getCronValues() {
  const inputs = document.querySelectorAll('#cron-rows input');
  return Array.from(inputs).map((i) => i.value);
}

// --- CLI (terminal) ---
let cliSocket = null;
let cliTerm = null;
let cliFitAddon = null;
let cliResizeHandler = null;

function closeCliConnection() {
  if (cliSocket) {
    try { cliSocket.close(); } catch {}
    cliSocket = null;
  }
  if (cliResizeHandler) {
    window.removeEventListener('resize', cliResizeHandler);
    cliResizeHandler = null;
  }
  if (cliTerm) {
    cliTerm.dispose();
    cliTerm = null;
  }
  cliFitAddon = null;
}

async function loadCliSessionsList() {
  try {
    const sessions = await api('GET', '/cli/sessions');
    const el = document.getElementById('cli-sessions-list');
    if (sessions.length === 0) {
      el.innerHTML = `<div class="cli-empty" data-i18n="cli.no_sessions"></div>`;
      applyTranslations();
      return;
    }
    el.innerHTML = sessions
      .map(
        (s) => `
      <div class="cli-session-item" data-session-id="${escapeHtml(s.id)}" title="${escapeHtml(s.id)}">
        ${escapeHtml(s.id)}
        <span class="session-time">${new Date(s.updatedAt).toLocaleString()}</span>
      </div>`
      )
      .join('');
    el.querySelectorAll('.cli-session-item').forEach((item) => {
      item.onclick = () => {
        document.querySelectorAll('nav .tab').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('nav .cli-session-item').forEach((b) => b.classList.remove('active'));
        item.classList.add('active');
        openCli('resume', item.dataset.sessionId);
      };
    });
  } catch {
    // brak sesji / brak dostepu do WORKSPACE_DIR - lista zostaje pusta, nie blokujemy reszty panelu
  }
}

document.getElementById('new-chat-btn').onclick = () => {
  document.querySelectorAll('nav .tab').forEach((b) => b.classList.remove('active'));
  document.querySelectorAll('nav .cli-session-item').forEach((b) => b.classList.remove('active'));
  openCli('new', null);
};

function openCli(mode, sessionId) {
  closeCliConnection();
  currentTab = 'cli';
  currentItem = null;

  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="cli-pane">
      <div class="cli-terminal" id="cli-terminal"></div>
      <div class="cli-status" id="cli-status">${t('cli.connecting')}</div>
    </div>
  `;

  cliTerm = new Terminal({
    cursorBlink: true,
    fontSize: 13,
    fontFamily: "'SF Mono', Consolas, 'Courier New', monospace",
    theme: { background: '#0f1115', foreground: '#e6e8eb' }
  });
  cliFitAddon = new FitAddon.FitAddon();
  cliTerm.loadAddon(cliFitAddon);
  cliTerm.open(document.getElementById('cli-terminal'));
  cliFitAddon.fit();

  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const params = new URLSearchParams({ mode });
  if (sessionId) params.set('sessionId', sessionId);
  cliSocket = new WebSocket(`${protocol}//${location.host}/ws/cli?${params.toString()}`);

  const statusEl = document.getElementById('cli-status');

  cliSocket.onopen = () => {
    statusEl.textContent = t('cli.connected');
    cliFitAddon.fit();
    cliSocket.send(JSON.stringify({ type: 'resize', cols: cliTerm.cols, rows: cliTerm.rows }));
  };
  cliSocket.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'data') cliTerm.write(msg.data);
    if (msg.type === 'error') {
      statusEl.textContent = t('error.prefix') + msg.message;
    }
    if (msg.type === 'exit') {
      statusEl.textContent = t('cli.disconnected') + (msg.exitCode !== undefined ? ` (kod ${msg.exitCode})` : '');
      loadCliSessionsList();
    }
  };
  cliSocket.onclose = () => {
    if (statusEl) statusEl.textContent = t('cli.disconnected');
  };
  cliSocket.onerror = () => {
    if (statusEl) statusEl.textContent = t('cli.disconnected');
  };

  cliTerm.onData((data) => {
    if (cliSocket && cliSocket.readyState === WebSocket.OPEN) {
      cliSocket.send(JSON.stringify({ type: 'input', data }));
    }
  });

  cliResizeHandler = () => {
    if (!cliFitAddon || !cliTerm) return;
    cliFitAddon.fit();
    if (cliSocket && cliSocket.readyState === WebSocket.OPEN) {
      cliSocket.send(JSON.stringify({ type: 'resize', cols: cliTerm.cols, rows: cliTerm.rows }));
    }
  };
  window.addEventListener('resize', cliResizeHandler);
}

// Wywolywane przez i18n.js po kazdej zmianie jezyka - odswiez wszystko
// co zostalo wygenerowane dynamicznie w aktualnym jezyku (etykiety motywu
// oraz zawartosc aktywnej zakladki, jesli jestesmy juz zalogowani).
function onLanguageChange() {
  renderThemeSwitches();
  const app = document.getElementById('app');
  if (app && app.style.display !== 'none' && currentTab !== 'cli') {
    renderTab();
  }
}

// Init
(async () => {
  await setLanguage(detectDefaultLang());
  try {
    const status = await fetch(API + '/auth/status').then((r) => r.json());
    if (!status.authRequired) {
      showApp();
      return;
    }
    // sprobuj czy sesja juz istnieje (cookie) - proba pobrania listy
    await api('GET', '/commands');
    showApp(status.username);
  } catch {
    showLogin();
  }
})();
</script>
