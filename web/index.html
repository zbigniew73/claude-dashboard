<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Dashboard</title>
<link rel="stylesheet" href="vendor/xterm.css">
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="theme-init.js"></script>
<style>
  :root {
    --bg: #f5f4f0;
    --panel: #ffffff;
    --border: #dcdad3;
    --text: #1c1d1f;
    --muted: #6b7078;
    --accent: #d97757;
    --accent-hover: #c96a4c;
    --danger: #e5534b;
    --input-bg: #ffffff;
    --mono: 'SF Mono', Consolas, 'Courier New', monospace;
  }
  html[data-theme="dark"] {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --input-bg: #0f1115;
  }
  @media (prefers-color-scheme: dark) {
    html[data-theme="system"] {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e6e8eb;
      --muted: #8b93a1;
      --input-bg: #0f1115;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .icon-select { display: inline-flex; align-items: center; gap: 6px; }
  .icon-select svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; }
  .icon-select select {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 8px;
    cursor: pointer;
    font-family: inherit;
  }
  #login-screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #login-screen .login-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #login-screen .top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; align-items: center; }
  .login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 320px;
  }
  .login-box h1 { font-size: 18px; margin: 0 0 20px; }
  input[type=password], input[type=text], textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { font-family: var(--mono); resize: vertical; }
  button {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.danger { background: var(--danger); }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }

  #app { display: none; height: 100vh; flex-direction: column; }
  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; }
  header nav.main-nav { flex: 1; display: flex; gap: 4px; margin-left: 24px; }

  main { flex: 1; display: flex; overflow: hidden; }
  nav {
    width: 200px;
    border-right: 1px solid var(--border);
    padding: 16px 0;
  }
  nav button.tab {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--muted);
    border-radius: 0;
    padding: 10px 20px;
    font-weight: 500;
  }
  nav button.tab.active { color: var(--text); background: var(--panel); border-left: 2px solid var(--accent); }

  nav .nav-separator { border: none; border-top: 1px solid var(--border); margin: 10px 16px; }
  nav .new-chat-btn {
    display: block;
    width: calc(100% - 32px);
    margin: 0 16px 8px;
    font-size: 13px;
    padding: 8px 10px;
    text-align: left;
  }
  nav .cli-sessions { padding: 0 16px; overflow-y: auto; max-height: 220px; }
  nav .cli-session-item {
    padding: 6px 4px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--muted);
    cursor: pointer;
    border-radius: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  nav .cli-session-item:hover { background: var(--panel); }
  nav .cli-session-item.active { background: var(--panel); color: var(--text); }
  nav .cli-session-item .session-time { display: block; font-size: 10px; opacity: 0.7; }
  nav .cli-empty { padding: 4px; font-size: 11px; color: var(--muted); }

  .content { flex: 1; display: flex; overflow: hidden; }
  .list-pane { width: 260px; border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
  .list-pane .item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    font-family: var(--mono);
  }
  .list-pane .item:hover { background: var(--panel); }
  .list-pane .item.active { background: var(--panel); color: var(--text); }
  .list-pane .new-item { margin-bottom: 10px; width: 100%; }
  .status-badge {
    display: inline-block;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 999px;
    margin-left: 6px;
    border: 1px solid var(--border);
    color: var(--muted);
    vertical-align: 1px;
  }
  .status-badge.status-in-progress { color: var(--accent); border-color: var(--accent); }
  .status-badge.status-done { color: #3fae74; border-color: #3fae74; }

  .editor-pane { flex: 1; display: flex; flex-direction: column; padding: 16px; overflow: hidden; }
  .editor-pane .toolbar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .editor-pane textarea { flex: 1; width: 100%; }
  .empty-state { color: var(--muted); padding: 40px; text-align: center; }

  .cron-editor { padding: 20px; max-width: 760px; overflow-y: auto; }
  .cron-editor .cron-help { font-size: 12px; color: var(--muted); margin-bottom: 14px; font-family: var(--mono); }
  .cron-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .cron-row input { flex: 1; font-family: var(--mono); }

  .cli-pane { flex: 1; display: flex; flex-direction: column; background: #0f1115; }
  .cli-pane .cli-terminal { flex: 1; padding: 8px; overflow: hidden; }
  .cli-pane .cli-status {
    padding: 6px 14px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    border-top: 1px solid #2a2f3a;
  }

  .hooks-editor { padding: 20px; max-width: 700px; }
  .hook-group { margin-bottom: 24px; }
  .hook-group h3 { font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
  .hook-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .hook-row input { flex: 1; font-family: var(--mono); }

  .app-footer {
    padding: 8px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-shrink: 0;
  }
  .app-footer a {
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
  }
  .app-footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-content">
    <div class="top-controls">
      <div class="lang-switch icon-select" id="lang-switch-login"></div>
      <div class="theme-switch icon-select" id="theme-switch-login"></div>
    </div>
    <div class="login-box">
      <h1>Claude Dashboard</h1>
      <input type="text" id="username-input" data-i18n-placeholder="login.username_placeholder" autocomplete="username" autofocus>
      <div style="height:8px;"></div>
      <input type="password" id="password-input" data-i18n-placeholder="login.password_placeholder" autocomplete="current-password">
      <div class="error-msg" id="login-error"></div>
      <button id="login-btn" style="width:100%;margin-top:10px;" data-i18n="login.button"></button>
    </div>
  </div>
  <footer class="app-footer">
    <a href="https://automation-ai.eu/" target="_blank" rel="noopener noreferrer">automation-ai.eu</a>
  </footer>
</div>

<div id="app">
  <header>
    <h1>Claude Dashboard</h1>
    <nav class="main-nav"></nav>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="ws-user" id="current-user" style="font-size:12px;color:var(--muted);font-family:var(--mono);"></span>
      <div class="lang-switch icon-select" id="lang-switch-app"></div>
      <div class="theme-switch icon-select" id="theme-switch-app"></div>
      <button class="secondary" id="logout-btn" data-i18n="header.logout"></button>
    </div>
  </header>
  <main>
    <nav>
      <button class="tab active" data-tab="tasks" data-i18n="nav.tasks"></button>
      <button class="tab" data-tab="commands" data-i18n="nav.commands"></button>
      <button class="tab" data-tab="skills" data-i18n="nav.skills"></button>
      <button class="tab" data-tab="agents" data-i18n="nav.agents"></button>
      <button class="tab" data-tab="hooks" data-i18n="nav.hooks"></button>
      <button class="tab" data-tab="cron" data-i18n="nav.cron"></button>
      <hr class="nav-separator">
      <button class="new-chat-btn secondary" id="new-chat-btn" data-i18n="cli.new_chat"></button>
      <div class="cli-sessions" id="cli-sessions-list"></div>
    </nav>
    <div class="content" id="content"></div>
  </main>
  <footer class="app-footer">
    <a href="https://automation-ai.eu/" target="_blank" rel="noopener noreferrer">automation-ai.eu</a>
  </footer>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
